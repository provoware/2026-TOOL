name: Zwei Vorgängerversionen sichern
on:
  push:
    branches: [main]
permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 4
      - name: Zwei vorherige main-Stände bestimmen
        id: refs
        shell: bash
        run: |
          set -euo pipefail
          BEFORE="${{ github.event.before }}"
          if [[ -z "$BEFORE" || "$BEFORE" =~ ^0+$ ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PREV2="$(git rev-parse "$BEFORE^1" 2>/dev/null || true)"
          [[ -n "$PREV2" ]] || { echo "FEHLER: zweiter Vorgänger nicht verfügbar"; exit 1; }
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "previous1=$BEFORE" >> "$GITHUB_OUTPUT"
          echo "previous2=$PREV2" >> "$GITHUB_OUTPUT"
      - name: Vollständige Zwei-Versionen-Sicherung erzeugen
        if: steps.refs.outputs.skip != 'true'
        env:
          PREVIOUS1: ${{ steps.refs.outputs.previous1 }}
          PREVIOUS2: ${{ steps.refs.outputs.previous2 }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p backup-artifact
          git archive --format=tar.gz --output=backup-artifact/previous-1.tar.gz "$PREVIOUS1"
          git archive --format=tar.gz --output=backup-artifact/previous-2.tar.gz "$PREVIOUS2"
          git branch --force __provoware_previous_1 "$PREVIOUS1"
          git branch --force __provoware_previous_2 "$PREVIOUS2"
          git bundle create backup-artifact/two-previous.bundle \
            refs/heads/__provoware_previous_1 refs/heads/__provoware_previous_2
          cat > backup-artifact/manifest.txt <<EOF
          PROVOWARE Zwei-Versionen-Backup
          previous-1=$PREVIOUS1
          previous-2=$PREVIOUS2
          source-main=${{ github.sha }}
          created=${{ github.event.head_commit.timestamp }}
          EOF
          (cd backup-artifact && sha256sum previous-1.tar.gz previous-2.tar.gz two-previous.bundle > SHA256SUMS)
      - name: Sicherung lokal nachvalidieren
        if: steps.refs.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -s backup-artifact/previous-1.tar.gz
          test -s backup-artifact/previous-2.tar.gz
          test -s backup-artifact/two-previous.bundle
          tar -tzf backup-artifact/previous-1.tar.gz >/dev/null
          tar -tzf backup-artifact/previous-2.tar.gz >/dev/null
          git bundle verify backup-artifact/two-previous.bundle
          (cd backup-artifact && sha256sum -c SHA256SUMS)
      - name: Zwei vollständige Vorgängerversionen hochladen
        if: steps.refs.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: provoware-two-previous-${{ github.run_number }}
          path: backup-artifact/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
