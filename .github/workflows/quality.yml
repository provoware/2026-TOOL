name: Release-Gate
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ausführbar machen
        run: chmod +x start.sh scripts/*.sh scripts/*.py
      - name: Vollständiges Release-Gate
        run: ./scripts/validate_all.sh
